<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest">
<title>VoxPDF V5 Modern Reader</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color-scheme:light dark;--bg:#eef1f5;--card:rgba(255,255,255,.88);--text:#111827;--muted:#6b7280;--accent:#2563eb;--soft:#e8edf5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none}
.app{min-height:100vh;padding-bottom:150px}.top{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(238,241,245,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(120,120,120,.14)}
.toprow{display:flex;align-items:center;gap:10px}.brand{font-size:20px;font-weight:800}.bookname{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.grow{flex:1}
.icon,.btn{border:0;background:var(--soft);color:var(--text);border-radius:14px;padding:10px 12px;font:inherit}.primary{background:var(--accent);color:white}.circle{width:48px;height:48px;border-radius:50%;font-size:20px;padding:0}.play{width:62px;height:62px;font-size:26px}
main{max-width:1000px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid rgba(120,120,120,.12);box-shadow:0 10px 30px rgba(0,0,0,.06);border-radius:22px;padding:12px;margin-bottom:12px;backdrop-filter:blur(16px)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.status{font-size:12px;color:var(--muted)}
.progress{height:5px;background:var(--soft);border-radius:10px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--accent);transition:width .25s}
#bookWrap{overflow:auto;max-height:67vh;border-radius:16px;background:#cfd4dc}#pageStage{position:relative;margin:auto}#pdfCanvas{display:block;background:white}
#textLayer{position:absolute;inset:0}.word{position:absolute;color:transparent;white-space:pre;border-radius:3px}.word.active{background:rgba(250,204,21,.62)}.word.spoken{background:rgba(250,204,21,.18)}
#plainText{white-space:pre-wrap;line-height:1.7;font-size:17px;padding:10px;max-height:65vh;overflow:auto}.hidden{display:none!important}
.player{position:fixed;left:10px;right:10px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:40;max-width:760px;margin:auto;background:rgba(255,255,255,.90);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(120,120,120,.18);border-radius:26px;padding:10px 14px;box-shadow:0 12px 38px rgba(0,0,0,.16)}
.player .row{justify-content:center}.mini{font-size:11px;color:var(--muted);text-align:center;margin-top:5px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:45;height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(250,250,250,.92);backdrop-filter:blur(22px);border-top:1px solid rgba(120,120,120,.18)}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px}.tab.active{color:var(--accent);font-weight:700}
.sheet{position:fixed;z-index:60;left:8px;right:8px;bottom:8px;max-width:760px;margin:auto;background:var(--card);border-radius:26px;padding:16px;box-shadow:0 15px 60px rgba(0,0,0,.28);backdrop-filter:blur(25px)}
select,input,textarea{font:inherit}select{max-width:100%;padding:9px;border-radius:12px;border:1px solid #d1d5db;background:transparent;color:inherit}textarea{width:100%;min-height:100px;border:1px solid #d1d5db;border-radius:14px;padding:10px;background:transparent;color:inherit}
.result{white-space:pre-wrap;line-height:1.55;background:var(--soft);border-radius:14px;padding:10px;margin-top:9px}.fileLabel{display:inline-block;cursor:pointer}
@media(prefers-color-scheme:dark){:root{--bg:#080d18;--card:rgba(17,24,39,.90);--text:#f9fafb;--muted:#b5becd;--soft:#273244}.top{background:rgba(8,13,24,.86)}.player{background:rgba(17,24,39,.92)}.tabs{background:rgba(10,15,25,.94)}}
</style></head>
<body><div class="app">
<header class="top"><div class="toprow"><div><div class="brand">VoxPDF</div><div id="bookName" class="bookname">Modern Reader · V5</div></div><div class="grow"></div><label class="icon fileLabel">＋ PDF<input id="file" type="file" accept=".pdf,application/pdf" hidden></label><button id="focus" class="icon">◫</button></div>
<div style="height:9px"></div><div class="row"><span id="pageInfo" class="status grow">Página 0 / 0</span><span id="percent" class="status">0%</span></div><div class="progress"><div id="progressBar"></div></div></header>
<main>
<section id="reader" class="card"><div id="loadStatus" class="status"></div><div id="bookWrap"><div id="pageStage"><canvas id="pdfCanvas"></canvas><div id="textLayer"></div></div></div></section>
<section id="textView" class="card hidden"><div id="plainText">Abra um PDF para começar.</div></section>
<section id="studyView" class="card hidden"><h3 style="margin-top:4px">Estudo</h3><textarea id="selectedText" placeholder="Selecione um trecho no modo Texto ou cole aqui."></textarea><div class="row" style="margin-top:8px"><select id="targetLang"><option value="pt">Português</option><option value="en">Inglês</option><option value="es">Espanhol</option><option value="fr">Francês</option></select><button id="translate" class="btn primary">Traduzir</button><button id="dictionary" class="btn">Dicionário</button><button id="summary" class="btn">Resumir página</button></div><div id="result" class="result hidden"></div></section>
</main>
<div id="player" class="player"><div class="row"><button id="prev" class="icon circle">‹</button><button id="back" class="icon circle">↶</button><button id="play" class="icon circle play primary">▶</button><button id="forward" class="icon circle">↷</button><button id="next" class="icon circle">›</button></div><div class="row" style="margin-top:8px"><button id="rateBtn" class="btn">1.0×</button><select id="voice" class="grow"></select><button id="testVoice" class="btn">Testar</button></div><div id="voiceStatus" class="mini"></div></div>
<nav id="tabs" class="tabs"><button class="tab active" data-view="reader">▣<br>Livro</button><button class="tab" data-view="textView">☰<br>Texto</button><button class="tab" data-view="studyView">✦<br>Estudo</button></nav>
</div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const $=id=>document.getElementById(id),E={};['file','bookName','pageInfo','percent','progressBar','loadStatus','bookWrap','pageStage','pdfCanvas','textLayer','plainText','reader','textView','studyView','player','tabs','prev','next','back','forward','play','rateBtn','voice','testVoice','focus','selectedText','targetLang','translate','dictionary','summary','result'].forEach(x=>E[x]=$(x));
let pdf=null,page=1,scale=1.25,items=[],words=[],wi=0,voices=[],rate=1,playing=false,g=0,objURL=null,key='';
const ctx=E.pdfCanvas.getContext('2d');
const vkey=v=>`${v.voiceURI}|${v.lang}|${v.name}`;
function voiceRank(v){let l=v.lang.toLowerCase();return l.startsWith('pt-br')?0:l.startsWith('pt-pt')?1:l.startsWith('pt')?2:3}
function loadVoices(){voices=speechSynthesis.getVoices().sort((a,b)=>voiceRank(a)-voiceRank(b)||a.name.localeCompare(b.name));let saved=localStorage.getItem('vox5voice');E.voice.innerHTML='';
[['Português do Brasil',v=>v.lang.toLowerCase().startsWith('pt-br')],['Português de Portugal',v=>v.lang.toLowerCase().startsWith('pt-pt')],['Outras vozes em português',v=>v.lang.toLowerCase().startsWith('pt')&&!v.lang.toLowerCase().startsWith('pt-br')&&!v.lang.toLowerCase().startsWith('pt-pt')],['Outros idiomas',v=>!v.lang.toLowerCase().startsWith('pt')]].forEach(([name,test])=>{let vs=voices.filter(test);if(!vs.length)return;let og=document.createElement('optgroup');og.label=name;vs.forEach(v=>{let o=document.createElement('option');o.value=vkey(v);o.textContent=`${v.name} — ${v.lang}`;og.appendChild(o)});E.voice.appendChild(og)});
if(saved&&voices.some(v=>vkey(v)===saved))E.voice.value=saved;else{let p=voices.find(v=>v.lang.toLowerCase().startsWith('pt-br'));if(p)E.voice.value=vkey(p)}
let br=voices.filter(v=>v.lang.toLowerCase().startsWith('pt-br')).length,pt=voices.filter(v=>v.lang.toLowerCase().startsWith('pt-pt')).length;$('voiceStatus').textContent=`Disponíveis no iPhone/Safari: ${br} pt-BR · ${pt} pt-PT`; }
speechSynthesis.onvoiceschanged=loadVoices;loadVoices();[250,800,1800].forEach(t=>setTimeout(loadVoices,t));
function chosen(){return voices.find(v=>vkey(v)===E.voice.value)}
E.voice.onchange=()=>{localStorage.setItem('vox5voice',E.voice.value);restart()};
E.testVoice.onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('Olá. Esta é a voz selecionada para a leitura do seu livro no VoxPDF.');let v=chosen();u.lang=v?.lang||'pt-BR';u.rate=rate;if(v)u.voice=v;speechSynthesis.speak(u)};
function split(a){let z=[];a.forEach(it=>{let t=(it.str||'').trim();if(!t)return;for(let m of t.matchAll(/\S+/g))z.push({text:m[0],item:it,start:(m.index||0)/Math.max(t.length,1),width:m[0].length/Math.max(t.length,1)})});return z}
function save(){if(key)localStorage.setItem('vox5:'+key,JSON.stringify({page,wi,rate}))}
function restore(){try{return JSON.parse(localStorage.getItem('vox5:'+key)||'{}')}catch{return{}}}
async function render(){if(!pdf)return;g++;speechSynthesis.cancel();E.loadStatus.textContent=`Carregando página ${page}…`;let p=await pdf.getPage(page),vp=p.getViewport({scale});E.pdfCanvas.width=Math.ceil(vp.width);E.pdfCanvas.height=Math.ceil(vp.height);E.pageStage.style.width=vp.width+'px';E.pageStage.style.height=vp.height+'px';await p.render({canvasContext:ctx,viewport:vp}).promise;let tc=await p.getTextContent();items=tc.items;words=split(items);wi=Math.min(wi,Math.max(0,words.length-1));overlay(vp);E.plainText.textContent=items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim()||'[Esta página não possui texto extraível.]';let pc=Math.round(page/pdf.numPages*100);E.pageInfo.textContent=`Página ${page} / ${pdf.numPages}`;E.percent.textContent=pc+'%';E.progressBar.style.width=pc+'%';E.loadStatus.textContent='';highlight();save()}
function overlay(vp){E.textLayer.innerHTML='';words.forEach((w,i)=>{let it=w.item,tx=pdfjsLib.Util.transform(vp.transform,it.transform),fh=Math.hypot(tx[2],tx[3]),fw=(it.width||0)*scale,s=document.createElement('span');s.className='word';s.textContent=w.text;s.style.left=(tx[4]+fw*w.start)+'px';s.style.top=(tx[5]-fh)+'px';s.style.width=Math.max(fw*w.width,4)+'px';s.style.height=Math.max(fh*1.15,8)+'px';s.onclick=()=>{wi=i;highlight();restart()};E.textLayer.appendChild(s)})}
function highlight(){E.textLayer.querySelectorAll('.word').forEach((x,i)=>{x.classList.toggle('active',i===wi);x.classList.toggle('spoken',i<wi)})}
function seg(s){let e=s,c=0;while(e<words.length&&c<230){c+=words[e].text.length+1;if(/[.!?;:]$/.test(words[e].text)&&c>40){e++;break}e++}return{text:words.slice(s,e).map(x=>x.text).join(' '),end:e}}
function speak(){if(!words.length)return;g++;let mine=g,s=seg(wi),u=new SpeechSynthesisUtterance(s.text),v=chosen();u.lang=v?.lang||'pt-BR';u.rate=rate;if(v)u.voice=v;u.onstart=()=>{if(mine===g){playing=true;E.play.textContent='⏸'}};u.onend=async()=>{if(mine!==g)return;wi=s.end;if(wi<words.length){highlight();save();speak()}else if(page<pdf.numPages){page++;wi=0;await render();speak()}else{playing=false;E.play.textContent='▶'}};speechSynthesis.speak(u)}
function restart(){if(speechSynthesis.speaking||playing){g++;speechSynthesis.cancel();setTimeout(speak,80)}}
E.play.onclick=()=>{if(speechSynthesis.paused){speechSynthesis.resume();E.play.textContent='⏸'}else if(speechSynthesis.speaking){speechSynthesis.pause();E.play.textContent='▶'}else speak()};
E.back.onclick=()=>{wi=Math.max(0,wi-5);highlight();restart()};E.forward.onclick=()=>{wi=Math.min(words.length-1,wi+5);highlight();restart()};
E.prev.onclick=async()=>{if(pdf&&page>1){page--;wi=0;await render()}};E.next.onclick=async()=>{if(pdf&&page<pdf.numPages){page++;wi=0;await render()}};
E.rateBtn.onclick=()=>{let rs=[.7,.8,1,1.2,1.5,1.8,2,2.5,3],i=rs.indexOf(rate);rate=rs[(i+1)%rs.length];E.rateBtn.textContent=rate.toFixed(1)+'×';save();restart()};
E.file.onchange=async ev=>{let f=ev.target.files?.[0];if(!f)return;key=`${f.name}:${f.size}:${f.lastModified}`;E.bookName.textContent=f.name;E.loadStatus.textContent='Preparando PDF…';if(objURL)URL.revokeObjectURL(objURL);try{objURL=URL.createObjectURL(f);pdf=await pdfjsLib.getDocument({url:objURL}).promise}catch(err){let b=await f.arrayBuffer();pdf=await pdfjsLib.getDocument({data:new Uint8Array(b)}).promise}let s=restore();page=s.page>=1&&s.page<=pdf.numPages?s.page:1;wi=s.wi||0;rate=s.rate||1;E.rateBtn.textContent=rate.toFixed(1)+'×';await render()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['reader','textView','studyView'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.view))});
let focus=false;E.focus.onclick=()=>{focus=!focus;E.player.classList.toggle('hidden',focus);E.tabs.classList.toggle('hidden',focus);document.querySelector('.top').classList.toggle('hidden',focus)};
document.addEventListener('selectionchange',()=>{let s=window.getSelection();if(s&&!s.isCollapsed&&s.toString().trim())E.selectedText.value=s.toString().trim()});
function result(t){E.result.textContent=t;E.result.classList.remove('hidden')}
E.translate.onclick=async()=>{let t=E.selectedText.value.trim();if(!t)return result('Selecione um trecho.');result('Traduzindo…');try{let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t.slice(0,4500))}&langpair=auto|${E.targetLang.value}`),j=await r.json();result(j?.responseData?.translatedText||'Sem tradução.')}catch{result('Não foi possível traduzir agora.')}};
E.dictionary.onclick=()=>{let w=E.selectedText.value.trim().split(/\s+/)[0];result(w?`Procure no Wikcionário: ${w}`:'Selecione uma palavra.')};
E.summary.onclick=()=>{let t=items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim(),s=t.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[];result(s.length?'Resumo rápido:\n\n'+s.slice(0,8).join(' '):'Sem texto extraível nesta página.')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
